[package]
name = "cliplite"
version = "1.0.0"
description = "A clean, cross-platform, open-source clipboard manager"
authors = ["ClipLite Contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/codedbytahir/cliplite"

[lib]
name = "cliplite_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
